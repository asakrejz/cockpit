# Agent setup (opt-in): lets Cockpit start agent containers on YOUR engine. Use it as an override file:
#
#   docker compose -f compose.yaml -f compose.agent.yaml up -d
#
# It only adds the engine socket; the volume, the user (the image drops root itself and picks up the socket's group)
# and everything else stay as in compose.yaml. Nothing has to be mounted at the same path as on the host: Cockpit copies
# the working folders of a run into the agent container and the result back (docs/container.md, "Agent containers").
#
# SECURITY: the mounted engine socket is root-equivalent access to your host. Whoever controls Cockpit (or the
# code that runs in it) can start any container, mount any folder and read or change anything the engine can reach.
# Only on a machine you trust, only if you want the agent. Alternative without this risk: start Cockpit natively
# (scripts/start.sh), see docs/container.md ("Agent containers").
#
#   DOCKER_SOCK   engine socket on the host (default: /var/run/docker.sock; Rancher Desktop on macOS: ~/.rd/docker.sock)
#
# Coming from the old agent file (host folder, `user: root`)? See docs/container.md, "Migrating from the host folder".
services:
  cockpit:
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
