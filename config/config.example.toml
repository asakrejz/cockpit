# Example configuration for Cockpit. All values are dummies.
#
# Cockpit creates `config/config.toml` on its own at the first start; the setup page in the app
# writes it for you. Copy this file only if you want to edit by hand:
#
#   cp config/config.example.toml config/config.toml
#
# Everything in `config/` except this example is ignored by Git. NEVER commit your own file.
# No keys belong here: tokens and secrets live in the file `config/.env`.

port = 8787                 # local port of the server
interval_s = 120            # sync every 2 minutes (at least 30)

[github]
api_url = "https://api.github.com"
# repos = ["acme/app", "acme/web"]   # optional "watched" repos: all their open pull requests (owner/name).
                            # Without it Cockpit finds your pull requests in every repo you can see.
# auth = "token"            # which sign-in the server uses: "token" or "oauth". Without it a working
                            # OAuth sign-in goes first, then the token. The setup assistant sets it.

[jira]
site = "acme"               # name or address of your Jira site
email = "you@example.com"   # account the API token belongs to
projects = ["APP", "WEB"]   # optional: only these projects
# team_field = "customfield_10400"   # optional: ID of the Jira "Team" field, only if the detection fails
# auth = "token"            # "token" or "oauth", as in [github]

# Sign-in with OAuth instead of tokens: only the client IDs, the secrets go in `config/.env`.
[github_oauth]
client_id = "Iv23liDummyClientId"

[atlassian]
client_id = "dummyAtlassianClientId"
site = "acme"               # optional: only if several sites are approved

[agent]
provider = "claude-agent-sdk"   # or "claude-code" or "codex"
container = "podman"            # or "docker"; omit to detect the runtime
repo = "acme/app"               # optional default repo; remove it to choose the repo at every start

# Optional settings per repo. Without an entry a repo uses its default branch and the usual branch pattern;
# the first start in a repo stores one (with watch = false). The repo itself is chosen when you start the agent
# on a ticket; older files may still carry `projects = ["WEB"]` here, which only acts as a quiet suggestion.
[[agent.repos]]
repo = "acme/web"
base_branch = "develop"         # optional, default "main"
branch_pattern = "feature/{ticket}-{slug}"   # optional; default "claude/{ticket}-{slug}"; also {type} = feature/fix/chore

[[agent.repos]]
repo = "acme/app"               # a repo entry only keeps its settings
# watch = false                 # true (default): the sync also loads all open pull requests of this repo

[agent.endpoint]
url = "https://litellm.example.com"   # proxy or compatible endpoint; omit to call the provider directly
model = "claude-sonnet-5-5"

# Optional webhooks that speed up the sync (see docs/setup-guide.md).
[server]
webhooks = false
public_url = "https://cockpit.example.com"

[sync]
webhook_fallback_interval_s = 600   # poll interval while webhooks arrive
