[workspace]
resolver = "3"
members = ["app", "cockpit", "crates/*", "features/*", "server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Gemeinsame Versionen für alle Crates im Workspace.
# In den einzelnen Crates reicht dann `leptos = { workspace = true }`.
[workspace.dependencies]
leptos = "0.8"
console_error_panic_hook = "0.1"
web-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Eigene Crates – so können die Apps (oder andere Projekte) sie einbinden.
feature-ui = { path = "features/ui" }
cockpit-core = { path = "crates/cockpit-core" }
cockpit-integrations = { path = "crates/integrations" }

[profile.release]
opt-level = "z"   # klein statt schnell – für WASM meist die bessere Wahl
lto = true
codegen-units = 1
