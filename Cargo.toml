[workspace]
resolver = "3"
members = ["apps/cockpit", "apps/playground", "apps/server", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Shared versions for all crates in the workspace.
# In the individual crates `leptos = { workspace = true }` is enough.
[workspace.dependencies]
leptos = "0.8"
console_error_panic_hook = "0.1"
web-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Own crates – so that the apps (or other projects) can include them.
feature-ui = { path = "crates/ui" }
cockpit-core = { path = "crates/cockpit-core" }
cockpit-i18n = { path = "crates/i18n" }
cockpit-integrations = { path = "crates/integrations" }

[profile.release]
opt-level = "z"   # small instead of fast – usually the better choice for WASM
lto = true
codegen-units = 1

# Dev and test builds (`cargo test`, `cargo build`, `trunk build`): only the line tables, so panics and backtraces still
# name file:line, but no variable info. Dependencies get no debug info at all. Keeps `target/` and the CI cache small.
# `profile.test` inherits from `dev`, so this covers `cargo test` as well.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
