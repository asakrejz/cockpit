<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rust Playground</title>

    <!-- Das Design nutzt Inter als Fallback, wenn keine SF Pro installiert ist. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Trunk baut die App (Rust → WASM) und bindet sie automatisch ein. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="playground" />

    <!-- Reihenfolge: 1. Design-Tokens (projektweit)  2. Komponenten  3. Hülle des Playgrounds -->
    <link data-trunk rel="css" href="../../crates/ui/tokens.css" />
    <link data-trunk rel="css" href="../../crates/ui/components.css" />
    <link data-trunk rel="css" href="../../crates/ui/extras.css" />
    <link data-trunk rel="css" href="style.css" />
  </head>
  <body></body>
</html>
