# Cockpit is built from this folder:  cd apps/cockpit && trunk serve --open  (with a running cockpit-server)
[build]
target = "index.html"
dist = "dist"

[serve]
port = 8081

# Development with `trunk serve`: requests to /api go to the local server
# (`cargo run -p cockpit-server`, started with COCKPIT_DEV_PORT=8081). The app needs the server.
[[proxy]]
backend = "http://127.0.0.1:8787/api"
