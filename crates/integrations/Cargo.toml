[package]
name = "cockpit-integrations"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Lesende Clients für GitHub und Jira Cloud und die Abbildung auf cockpit-core"

# Native only (backend) – does not compile for WebAssembly.
[dependencies]
cockpit-core = { workspace = true }
cockpit-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# rustls instead of OpenSSL: no system library needed.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# PKCE and random values for `state` (backend only)
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
