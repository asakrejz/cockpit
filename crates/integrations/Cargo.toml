[package]
name = "cockpit-integrations"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Clients for GitHub and Jira Cloud and the mapping of their responses onto cockpit-core"

# Native only (backend) – does not compile for WebAssembly.
[dependencies]
cockpit-core = { workspace = true }
cockpit-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# rustls instead of OpenSSL: no system library needed.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls"] }
# PKCE and random values for `state` (backend only)
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
