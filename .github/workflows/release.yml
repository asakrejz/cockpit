name: Release

# On a tag like v0.1.0, builds a ready-made archive for macOS (Apple Silicon): server and app in
# one folder, started by double-clicking `start-cockpit.command` – without Rust and Trunk.
# The file is not signed; macOS asks on the first open (right-click › Open).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  archive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Build the app
        run: trunk build --release
        working-directory: apps/cockpit
      - name: Build the server
        run: cargo build --release -p cockpit-server

      - name: Assemble the archive
        run: |
          name="cockpit-${GITHUB_REF_NAME}-macos-arm64"
          mkdir -p "$name/apps/cockpit"
          cp target/release/cockpit-server "$name/"
          cp -R apps/cockpit/dist "$name/apps/cockpit/dist"
          # Containerfile and runner of the agent (without node_modules): "Build image" needs them.
          mkdir -p "$name/apps/agent/runner"
          cp apps/agent/Containerfile apps/agent/README.md "$name/apps/agent/"
          cp -R apps/agent/runner/package.json apps/agent/runner/package-lock.json apps/agent/runner/src "$name/apps/agent/runner/"
          cp start-cockpit.command "$name/"
          cp README.md "$name/README.md"
          chmod +x "$name/cockpit-server" "$name/start-cockpit.command"
          # `ditto` keeps the permissions (executable).
          ditto -c -k --keepParent "$name" "$name.zip"
          echo "ARCHIV=$name.zip" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIV" \
            --title "Cockpit $GITHUB_REF_NAME" \
            --notes "Fertiges Archiv für macOS (Apple Silicon). Entpacken, dann Rechtsklick auf „start-cockpit.command“ › Öffnen. Anleitung: README.md im Archiv, Abschnitt „Schnellstart für Einsteiger“."
