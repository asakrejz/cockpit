name: Container image

# On a pull request that touches the image itself (Containerfile, container/, this workflow, ...; not every source change):
# builds the image and checks its size, nothing else (no login, push, prune or cache write).
# On every push to main: builds the Cockpit image (linux/amd64 and linux/arm64), checks its compressed size,
# publishes it as ghcr.io/<owner>/cockpit:latest and deletes every other package version, so that the
# storage of the private repo never grows. Only `latest` exists. How to use it: docs/container.md.
#
# Multi-arch without a slow Rust build under emulation: the Containerfile cross-compiles the server on the
# runner; QEMU is only needed for the small `apt-get install` of the final stage on arm64.
#
# Layer cache (GitHub Actions cache): only `main` writes it (`mode=max`: every stage, so the compiled dependencies are in
# it); pull requests and manual runs on other branches only read it. A PR therefore reuses what `main` built last.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - container/**
      - scripts/image-size.sh
      - .github/workflows/image.yml
      - rust-toolchain.toml
  workflow_dispatch:

# Two pushes after each other must not prune each other's versions.
concurrency:
  # Publishing runs (main) queue behind each other and are never cancelled. Every other ref (a pull request, a manual run
  # on a branch) has its own group, and a newer commit cancels the run still in progress there.
  group: container-image-${{ github.ref == 'refs/heads/main' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  PACKAGE: cockpit
  SIZE_LIMIT_MB: "450"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Lower-case owner (GHCR names are lower case)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      # 1. Build without pushing and measure the compressed size. Too big: fail before anything is published.
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          # Only main writes the cache (empty = not at all).
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      - name: Check size (limit ${{ env.SIZE_LIMIT_MB }} MB compressed)
        run: LIMIT_MB="$SIZE_LIMIT_MB" scripts/image-size.sh "$RUNNER_TEMP/image.tar"

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Push: every layer comes from step 1 (the same builder still holds them, `cache-from` is the fallback), so this
      #    step only uploads. It does not write the cache again. No provenance/SBOM, so there are no extra
      #    attestation manifests that would show up as additional package versions.
      - name: Push latest
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ env.OWNER }}/${{ env.PACKAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      # 3. Delete everything except the version just pushed (see scripts/prune-image-versions.sh).
      - name: Prune old versions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          image="ghcr.io/$OWNER/$PACKAGE"
          # The index plus the digests of its platform manifests: they are separate package versions
          # and must stay, otherwise `docker pull` of that architecture breaks.
          children=$(docker buildx imagetools inspect --raw "$image@$DIGEST" | jq -r '.manifests[].digest')
          test -n "$children"
          KEEP_DIGESTS="$DIGEST $(echo $children)" scripts/prune-image-versions.sh
          # Report what is left.
          docker buildx imagetools inspect "$image:latest" | head -20
