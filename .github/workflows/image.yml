name: Container image

# On a pull request that touches the image: builds the image and checks its size, nothing else (no login, push or prune).
# On every push to main: builds the Cockpit image (linux/amd64 and linux/arm64), checks its compressed size,
# publishes it as ghcr.io/<owner>/cockpit:latest and deletes every other package version, so that the
# storage of the private repo never grows. Only `latest` exists. How to use it: docs/container.md.
#
# Multi-arch without a slow Rust build under emulation: the Containerfile cross-compiles the server on the
# runner; QEMU is only needed for the small `apt-get install` of the final stage on arm64.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
      - scripts/image-size.sh
      - .github/workflows/image.yml
  workflow_dispatch:

# Two pushes after each other must not prune each other's versions.
concurrency:
  # Pull requests get their own group per ref; only publishing runs queue behind each other.
  group: container-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PACKAGE: cockpit
  SIZE_LIMIT_MB: "450"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Lower-case owner (GHCR names are lower case)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      # 1. Build without pushing and measure the compressed size. Too big: fail before anything is published.
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check size (limit ${{ env.SIZE_LIMIT_MB }} MB compressed)
        run: LIMIT_MB="$SIZE_LIMIT_MB" scripts/image-size.sh "$RUNNER_TEMP/image.tar"

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Push: the layers come from the cache of step 1. No provenance/SBOM, so there are no extra
      #    attestation manifests that would show up as additional package versions.
      - name: Push latest
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ env.OWNER }}/${{ env.PACKAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Delete everything except the version just pushed (see scripts/prune-image-versions.sh).
      - name: Prune old versions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          image="ghcr.io/$OWNER/$PACKAGE"
          # The index plus the digests of its platform manifests: they are separate package versions
          # and must stay, otherwise `docker pull` of that architecture breaks.
          children=$(docker buildx imagetools inspect --raw "$image@$DIGEST" | jq -r '.manifests[].digest')
          test -n "$children"
          KEEP_DIGESTS="$DIGEST $(echo $children)" scripts/prune-image-versions.sh
          # Report what is left.
          docker buildx imagetools inspect "$image:latest" | head -20
