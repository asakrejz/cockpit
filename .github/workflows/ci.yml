name: CI

on:
  push:
  pull_request:

jobs:
  # Credentials live in a local `.env`; no `.env*` file may ever be tracked.
  no-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::These files must not be committed (remove with git rm --cached, rotate the keys):"
            echo "$tracked"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      # The server crates only run natively and do not compile for WebAssembly.
      - name: Clippy (Wasm)
        run: cargo clippy --workspace --exclude cockpit-server --exclude cockpit-integrations --all-targets --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (server, native)
        run: cargo clippy -p cockpit-server -p cockpit-integrations --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - name: Build playground
        run: trunk build --release
        working-directory: apps/playground
      - name: Build cockpit
        run: trunk build --release
        working-directory: apps/cockpit

  # The runner of the agent (Node/TypeScript). The tests need neither network nor the real SDK.
  laeufer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Runner tests
        run: node --disable-warning=ExperimentalWarning --test test/*.test.ts
        working-directory: apps/agent/runner
