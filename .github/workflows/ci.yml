name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      # Die Server-Crates laufen nur nativ und kompilieren nicht für WebAssembly.
      - name: Clippy (Wasm)
        run: cargo clippy --workspace --exclude cockpit-server --exclude cockpit-integrations --all-targets --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (Server, nativ)
        run: cargo clippy -p cockpit-server -p cockpit-integrations --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - name: Build playground
        run: trunk build --release
      - name: Build cockpit
        run: trunk build --release
        working-directory: cockpit
