# Cockpit as a container: `docker compose up -d` (or `podman compose up -d`).
# Run the same command again to update: it pulls a newer image if there is one, recreates the container only
# when the image changed, and leaves a running, up-to-date container alone. Docs: docs/container.md
#
# Log in to ghcr.io first (the image is private, see docs/container.md). Stop with `docker compose down`;
# NEVER add `-v`: it deletes the volume with your config, database and keys.
#
# Optional overrides (shell environment or a `.env` file next to this file):
#   COCKPIT_IMAGE   image to run         (default: ghcr.io/asakrejz/cockpit:latest)
#   COCKPIT_PORT    host port            (default: 8787; also used inside, so the OAuth callback matches)
#   COCKPIT_VOLUME  name of the volume   (default: cockpit-config)
name: cockpit

services:
  cockpit:
    image: ${COCKPIT_IMAGE:-ghcr.io/asakrejz/cockpit:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      # Publish on 127.0.0.1 only: a bare "8787:8787" would expose the server to your network (docs/security.md).
      - "127.0.0.1:${COCKPIT_PORT:-8787}:8787"
    environment:
      # The server accepts this port in the Host header (needed when the host port is not 8787).
      COCKPIT_PUBLIC_PORT: ${COCKPIT_PORT:-8787}
      # COCKPIT_BIND=0.0.0.0 and COCKPIT_CONTAINER=docker are already set by the image.
    volumes:
      - cockpit-config:/app/config
    healthcheck:
      test: ["CMD", "cockpit-server", "health"]
      interval: 30s
      timeout: 8s
      start_period: 10s
      retries: 3

    # --- Agent containers (opt-in) ------------------------------------------------------------
    # SECURITY: a mounted engine socket is root-equivalent access to your host. Whoever controls Cockpit can start
    # any container and read or change anything the engine can reach. Only on a machine you trust, only if you
    # want the agent. See docs/container.md ("Agent containers"). Paths must match on host and inside, so a host
    # folder replaces the named volume: remove the `cockpit-config:/app/config` line above, uncomment the
    # lines below and replace /home/you/cockpit-config (create it first, writable for user id 10001 or use root).
    # user: root
    # environment:
    #   COCKPIT_CONFIG: /home/you/cockpit-config/config.toml
    #   COCKPIT_DB: /home/you/cockpit-config/cockpit.db
    #   COCKPIT_ENV_FILE: /home/you/cockpit-config/.env
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock   # socket path depends on the engine, see the table in the docs
    #   - /home/you/cockpit-config:/home/you/cockpit-config

volumes:
  cockpit-config:
    # Fixed name, so an existing `cockpit-config` volume (from the old `docker run`) is reused, with its data.
    name: ${COCKPIT_VOLUME:-cockpit-config}
